<div class="hxp-cancel-dialog">
    <h1 mat-dialog-title>
        {{ 'CREATE_FOLDER.CANCEL.TITLE' | translate }}
    </h1>
    <div mat-dialog-content>
        <p>{{ 'CREATE_FOLDER.CANCEL.DESCRIPTION' | translate }}</p>
    </div>
    <mat-dialog-actions align="end">
        <button
            mat-button
            data-automation-id="hxp-cancel-dialog-reject-button"
            (click)="reject()"
        >
            {{ 'CREATE_FOLDER.CANCEL.REJECT' | translate }}
        </button>
        <button
            mat-flat-button
            data-automation-id="hxp-cancel-dialog-confirm-button"
            (click)="confirm()"
        >
            {{ 'CREATE_FOLDER.CANCEL.CONFIRM' | translate }}
        </button>
    </mat-dialog-actions>
</div>
