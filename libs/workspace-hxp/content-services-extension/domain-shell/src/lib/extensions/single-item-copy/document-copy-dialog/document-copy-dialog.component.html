<div class="hxp-dialog-fixed-size-wrapper">
    <h1 mat-dialog-title>{{ 'COPY.DIALOG.COPY_ITEM' | translate }}</h1>
    <div
        mat-dialog-content
        class="hxp-fixed-dialog-content-height"
    >
        <form [formGroup]="copyDocumentForm">
            <div class="hxp-copy-dialog-field-container">
                <mat-form-field
                    appearance="fill"
                    class="hxp-copy-dialog-search-hide"
                >
                    <input
                        matInput
                        md-select-on-focus
                        placeholder="{{ 'COPY.FOLDER_SEARCH_PLACEHOLDER' | translate }}"
                        formControlName="copied_link"
                        type="text"
                    />
                    <mat-icon
                        matSuffix
                        svgIcon="search"
                    />
                </mat-form-field>
                <div
                    class="hxp-breadcrumb-scroll-container"
                    hxpAppScrollTracker
                    [scrollOffset]="50"
                    (scrolledToBottom)="onScroll()"
                >
                    <hxp-folder-breadcrumb
                        [breadcrumbData]="breadcrumbData$ | async"
                        (selectedFolder)="onSelectedFolder($event)"
                    />
                    @if (isLoading$ | async) {
                        <hxp-tree-skeleton-loader [skeletonRows]="5" />
                    }
                </div>
            </div>
        </form>
        <div class="hxp-copy-dialog-no-permissions-error">
            @if (!isAvailable) {
                {{ 'COPY.DIALOG.PERMISSIONS.ERROR' | translate }}
            }
        </div>
    </div>
    <div
        mat-dialog-actions
        align="end"
    >
        <button
            mat-button
            data-automation-id="hxp-copy-dialog-cancel-button"
            mat-dialog-close
        >
            {{ 'COPY.DIALOG.CANCEL' | translate }}
        </button>
        <button
            mat-flat-button
            class="hxp-single-file-copy-btn"
            [disabled]="!isAvailable || isCopying"
            (click)="onCopy()"
        >
            <span class="hxp-single-file-copy-btn-label">
                @if (isCopying) {
                    <mat-progress-spinner
                        mode="indeterminate"
                        diameter="15"
                    />
                }
                {{ 'COPY.DIALOG.COPY' | translate }}
            </span>
        </button>
    </div>
</div>
