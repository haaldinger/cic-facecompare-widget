<div class="hxp-dialog-fixed-size-wrapper">
    <h1 mat-dialog-title>{{ 'MOVE.DIALOG.MOVE_ITEM' | translate }}</h1>
    <div
        mat-dialog-content
        class="hxp-fixed-dialog-content-height"
    >
        <form [formGroup]="moveDocumentForm">
            <div class="hxp-move-dialog-field-container">
                <mat-form-field
                    appearance="fill"
                    class="hxp-move-dialog-search-hide"
                >
                    <input
                        matInput
                        placeholder="{{ 'MOVE.FOLDER_SEARCH_PLACEHOLDER' | translate }}"
                        formControlName="target_folder_id"
                        type="text"
                        md-select-on-focus
                    />
                    <mat-icon
                        matSuffix
                        svgIcon="search"
                    />
                </mat-form-field>
                <div
                    class="hxp-breadcrumb-scroll-container"
                    hxpAppScrollTracker
                    [scrollOffset]="50"
                    (scrolledToBottom)="onScroll()"
                >
                    <hxp-folder-breadcrumb
                        [breadcrumbData]="breadcrumbData$ | async"
                        (selectedFolder)="onSelectedFolder($event)"
                    />
                    <hxp-tree-skeleton-loader
                        *ngIf="isLoading$ | async"
                        [skeletonRows]="5"
                    />
                </div>
            </div>
        </form>
        <div class="hxp-move-dialog-no-permissions-error">
            <ng-container *ngIf="!isAvailable">
                {{ 'MOVE.DIALOG.PERMISSIONS.ERROR' | translate }}
            </ng-container>
        </div>
    </div>
    <div
        mat-dialog-actions
        align="end"
    >
        <button
            mat-button
            mat-dialog-close
        >
            {{ 'MOVE.DIALOG.CANCEL' | translate }}
        </button>
        <button
            mat-flat-button
            class="hxp-single-file-move-button"
            [disabled]="!isAvailable || isMoving"
            (click)="onMove()"
        >
            <span class="hxp-single-file-move-button-label">
                <mat-progress-spinner
                    *ngIf="isMoving"
                    mode="indeterminate"
                    diameter="15"
                />
                {{ 'MOVE.DIALOG.MOVE' | translate }}
            </span>
        </button>
    </div>
</div>
