<div
    class="hxp-document-list-count"
    *ngIf="selectedItems.length > 0"
>
    <div class="hxp-selected-item-count">
        <span>{{ selectedItems.length }}</span> {{ 'APP.TOOLBAR.SELECTED' | translate }}
    </div>
    <div class="hxp-clear-selection">
        <button
            mat-icon-button
            [attr.aria-label]="'APP.TOOLBAR.CLEAR_ALL' | translate"
            (click)="clearSelection()"
        >
            <mat-icon svgIcon="x_large" />
        </button>
    </div>
</div>
