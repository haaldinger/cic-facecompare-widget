<hxp-filter-chip
    [labelTranslationKey]="filter?.translationKey || ''"
    [suffix]="labelSuffix ? labelSuffix.label : null"
    [chipCount]="labelSuffix ? labelSuffix.count : null"
    [removable]="filter?.allowEmpty ?? true"
    (chipClick)="onFilterButtonClick()"
    (removeIconClick)="removeFilter()"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    [attr.data-automation-id]="filter?.name + '-filter-chip'"
/>

<ng-template
    hxpFilterMenuOverlay
    [overlayOrigin]="trigger"
    [overlayOpen]="isMenuOpen"
    (detach)="isMenuOpen = false"
>
    <hxp-checkbox-filter-menu
        [options]="options"
        [allowEmpty]="filter?.allowEmpty ?? true"
        (update)="onUpdate($event)"
        data-automation-id="hxp-checkbox-filter-menu"
    />
</ng-template>
