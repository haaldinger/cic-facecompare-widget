<ng-container *ngIf="moreMenu$ | async as moreMenu">
    <button
        mat-icon-button
        [matMenuTriggerFor]="menu"
        data-automation-id="toolbar-more-menu-button"
    >
        <mat-icon [svgIcon]="moreMenu.icon" />
    </button>
    <mat-menu
        #menu="matMenu"
        xPosition="before"
    >
        <ng-container *ngFor="let action of moreMenu.children">
            <hxp-toolbar-menu-item [item]="action" />
        </ng-container>
    </mat-menu>
</ng-container>
