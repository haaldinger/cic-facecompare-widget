<div class="hxp-permission-dialog-search-holder">
    <mat-form-field class="hxp-permission-dialog-search-holder-form-field">
        <input
            id="hxp-permission-user-search"
            class="hxp-permission-dialog-search"
            matInput
            placeholder="{{ placeHolder }}"
            type="text"
            [matAutocomplete]="auto"
            (keyup)="onKey($event)"
        />

        <mat-icon
            matSuffix
            svgIcon="search"
        />

        <mat-autocomplete
            autoActiveFirstOption
            #auto="matAutocomplete"
        >
            <mat-option
                *ngFor="let option of activePermissionsManagementRows; trackBy: permissionsManagementRowTrackBy"
                [value]="option.entityLabel"
                (click)="emit(option.entityLabel)"
            >
                {{ option.entityLabel }}
            </mat-option>
        </mat-autocomplete>
    </mat-form-field>
</div>
