<h2 mat-dialog-title>{{ dialogTitle | translate }}</h2>
<mat-dialog-content class="hxp-fixed-dialog-content-height">
    {{ dialogDescription | translate }}
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button
        mat-button
        mat-dialog-close
    >
        {{ 'DOCUMENT_DELETE.APP.DIALOGS.DELETE.BUTTONS.CANCEL' | translate }}
    </button>
    <button
        mat-flat-button
        class="hxp-confirm-delete-button"
        [class.hxp-disable-btn]="isDeleting"
        (click)="onDelete()"
    >
        <span class="hxp-confirm-delete-button-label">
            @if (isDeleting) {
                <mat-progress-spinner
                    mode="indeterminate"
                    diameter="15"
                />
            }
            {{ dialogTitle | translate }}
        </span>
    </button>
</mat-dialog-actions>
