<h1 mat-dialog-title>{{ 'MANAGE_VERSIONS.DELETE_DIALOG.TITLE' | translate }}</h1>
<div
    mat-dialog-content
    class="hxp-fixed-dialog-content-height"
>
    <p>{{ 'MANAGE_VERSIONS.DELETE_DIALOG.DESCRIPTION' | translate }}</p>
</div>
<mat-dialog-actions [align]="'end'">
    <button
        mat-button
        mat-dialog-close
    >
        {{ 'MANAGE_VERSIONS.DELETE_DIALOG.BUTTONS.CANCEL' | translate }}
    </button>
    <button
        mat-flat-button
        class="hxp-version-delete-button"
        [class.hxp-disable-btn]="isDeleting"
        (click)="onDelete()"
    >
        <span class="hxp-version-delete-button-label">
            @if (isDeleting) {
                <mat-progress-spinner
                    mode="indeterminate"
                    diameter="15"
                />
            }
            {{ 'MANAGE_VERSIONS.DELETE_DIALOG.BUTTONS.DELETE' | translate }}
        </span>
    </button>
</mat-dialog-actions>
