@if (isAvailable) {
    <button
        mat-menu-item
        class="hxp-restore-version-button"
        (click)="restoreVersion()"
        aria-labelledby="hxp-restore-version-button-label"
    >
        <mat-icon svgIcon="clock" />
        <span id="hxp-restore-version-button-label">{{ 'DOCUMENT_RESTORE_VERSION.LABEL' | translate }}</span>
    </button>
}
