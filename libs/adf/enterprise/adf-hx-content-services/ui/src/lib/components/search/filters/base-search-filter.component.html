<div class="hxp-search-filter">
    <mat-chip-set>
        <mat-chip
            #chip
            (click)="openFilterOverlay()"
            class="hxp-search-filter-chip"
            [class.hxp-search-filter-chip_active]="value"
            [class.hxp-search-filter-chip_opened]="isFilterOverlayOpened"
            [matTooltip]="value?.label | translate"
        >
            <span class="hxp-search-filter-chip-label">{{ name + (value?.label ? ': ' + (value.label | translate) : '') }}</span>
            <mat-icon
                class="hxp-search-filter-chip-icon"
                [svgIcon]="isFilterOverlayOpened ? 'chevron_up' : 'chevron_down'"
            />
        </mat-chip>
    </mat-chip-set>
    <ng-template #template>
        <div class="hxp-search-filter-overlay">
            <ng-content />

            <div class="hxp-search-filter-overlay-actions">
                <button
                    class="hxp-search-filter-overlay-actions-clear"
                    mat-button
                    (click)="clearFilter()"
                    [disabled]="!value"
                >
                    {{ 'SEARCH.FILTERS.ACTIONS.CLEAR_ALL' | translate }}
                </button>
                <button
                    class="hxp-search-filter-overlay-actions-apply"
                    mat-flat-button
                    (click)="applyFilter()"
                    [disabled]="!value && !selectedValue"
                >
                    {{ 'SEARCH.FILTERS.ACTIONS.APPLY' | translate }}
                </button>
            </div>
        </div>
    </ng-template>
</div>
